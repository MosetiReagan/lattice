name: "Feature Request"
description: "Suggest a feature, optimization, or architectural improvement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate feedback on making Lattice faster, more resilient, and easier to use.
  - type: textarea
    id: problem
    attributes:
      label: "Problem or Use Case"
      description: "What problem are you trying to solve, or what friction did you encounter?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution / Interface"
      description: "Describe how you envision this working (CLI flag, API parameter, scheduling behavior)"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternative Approaches"
      description: "Did you consider any other workarounds or designs?"
