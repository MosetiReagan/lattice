[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lattice-inference"
version = "0.3.0a1"
description = "Instant chat replies for local LLMs even while heavy background tasks are running on CPU"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
provision = ["cmake==4.4.5", "ninja==1.13.2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
evaluation = [
    "pyarrow==23.0.1",
]

[project.scripts]
lattice = "lattice.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: real CPU model and backend required"]

[tool.hatch.build.targets.wheel]
packages = ["src/lattice"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/configs", "/docs/*.md", "/benchmarks/datasets/quality-smoke.json", "/benchmarks/datasets/corpus-smoke.txt", "/benchmarks/datasets/README.md", "/benchmarks/datasets/sources.lock.json", "/benchmarks/datasets/tydiqa.lock.json", "/benchmarks/datasets/xquad.lock.json", "/benchmarks/datasets/license-errata-v1.json", "/benchmarks/datasets/catalog-v1.json", "/benchmarks/datasets/catalog-curated-v1.json", "/benchmarks/datasets/eval-subsets-curated-v1.json", "/benchmarks/datasets/eval-subsets-v1.json", "/benchmarks/datasets/multilingual-subset-v1.json", "/benchmarks/datasets/source_audit", "/benchmarks/datasets/examples", "/benchmarks/datasets/manifests", "/benchmarks/workloads", "/benchmarks/baseline", "/benchmarks/serving", "/experiments", "/dashboard", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/uv.lock", "/pyproject.toml"]
